# Ingest vhost for microcontrollers.
#
# Deliberately a separate hostname from sgu-acw.hsn8086.com, for two reasons:
#
#   1. This one is meant to be pointed at as a DNS-only record, so a device
#      reaches the origin directly and sees the RSA origin certificate. The
#      proxied hostname serves an ECDSA certificate from the Cloudflare edge,
#      which ESP8266-class TLS stacks cannot validate.
#   2. Port 80 here does NOT redirect to https. The main site does, and the
#      redirect is evaluated before location matching, so it cannot be carved
#      out with a location block.
#
# Only /heartbeat is exposed. Everything else is 404.

server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name hb.hsn8086.com ;

    access_log /www/sites/hb.hsn8086.com/log/access.log main ;
    error_log /www/sites/hb.hsn8086.com/log/error.log ;

    location ^~ /heartbeat {
        proxy_pass http://127.0.0.1:8090 ;
        proxy_set_header Host $host ;
        proxy_set_header X-Real-IP $remote_addr ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
        proxy_http_version 1.1 ;
        proxy_read_timeout 10s ;
        proxy_send_timeout 10s ;
        add_header Cache-Control no-store ;
    }

    location / {
        return 404 ;
    }

    ssl_certificate /www/sites/hb.hsn8086.com/ssl/fullchain.pem ;
    ssl_certificate_key /www/sites/hb.hsn8086.com/ssl/privkey.pem ;
    ssl_protocols TLSv1.3 TLSv1.2 ;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305 ;
    ssl_prefer_server_ciphers on ;
    ssl_session_cache shared:SSL:10m ;
    ssl_session_timeout 10m ;
    error_page 497 https://$host$request_uri ;
    add_header Strict-Transport-Security "max-age=31536000" ;
}
