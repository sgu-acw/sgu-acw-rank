# 题库评测运行器（judge.zh314.xyz）
#
# 必须和主站分域名：运行器里跑的是用户提交的代码，同域会拿到主站 Cookie。
# 这里只提供三类东西，其余一律 404：
#   /engine/*     host.js、worker.js、sw.js 和它们的 chunk
#   /packages/*   语言包对象（Brotli 压缩，内容哈希寻址，可长期缓存）
#   /engine/?parent=...  沙箱 iframe 的入口页
#
# CSP 由 nginx 加，不放在应用里：worker 里禁止一切网络访问，host 只允许
# 读自己的资源。

server {
    listen 80 ;
    include /www/sites/judge.zh314.xyz/secret/tls.d/*.conf ;
    server_name judge.zh314.xyz ;

    root /www/sites/judge.zh314.xyz/public ;
    charset utf-8 ;

    access_log /www/sites/judge.zh314.xyz/log/access.log main ;
    error_log /www/sites/judge.zh314.xyz/log/error.log ;

    client_max_body_size 1m ;

    # 语言包已经压过 Brotli，不再 gzip；只有 JS/HTML 走 gzip。
    gzip on ;
    gzip_vary on ;
    gzip_min_length 1024 ;
    gzip_types text/javascript application/javascript application/json ;

    # 内容哈希寻址，永久缓存。
    location ^~ /packages/objects/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always ;
        add_header Access-Control-Allow-Origin "*" always ;
        try_files $uri =404 ;
    }

    location ^~ /packages/ {
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location = /engine/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; frame-ancestors https://sgu-acw.zh314.xyz http://127.0.0.1:4324; base-uri 'none'; form-action 'none'" always ;
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        try_files /engine/index.html =404 ;
    }

    location = /engine/worker.js {
        # worker 内部不允许任何网络请求，语言包只能由 host 预先取好传进来。
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'none'; base-uri 'none'" always ;
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        try_files $uri =404 ;
    }

    location ^~ /engine/ {
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        add_header Referrer-Policy "no-referrer" always ;
        try_files $uri =404 ;
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/" always ;
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location / {
        return 404 ;
    }
}
