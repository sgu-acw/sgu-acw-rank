# 题库评测运行器（judge.zh314.xyz）
#
# 必须和主站分域名：运行器里跑的是用户提交的代码，同域会拿到主站 Cookie。
# 这里只提供三类东西，其余一律 404：
#   /engine/*     host.js、worker.js、sw.js 和它们的 chunk
#   /packages/*   语言包对象（Brotli 压缩，内容哈希寻址，可长期缓存）
#   /engine/?parent=...  沙箱 iframe 的入口页
#
# CSP 由 nginx 加，不放在应用里：worker 里禁止一切网络访问，host 只允许
# 读自己的资源。

server {
    listen 80 ;
    include /www/sites/judge.zh314.xyz/secret/tls.d/*.conf ;
    server_name judge.zh314.xyz ;

    root /www/sites/judge.zh314.xyz/public ;
    charset utf-8 ;

    access_log /www/sites/judge.zh314.xyz/log/access.log main ;
    error_log /www/sites/judge.zh314.xyz/log/error.log ;

    client_max_body_size 1m ;

    # 语言包对象在发布时已经用 Brotli 1.2.1 压好；只有引擎页面走 gzip。
    gzip on ;
    gzip_vary on ;
    gzip_min_length 1024 ;
    gzip_types text/javascript application/javascript application/json ;

    # 内容哈希寻址，永久缓存。对象同时保留原件和 Brotli 文件，响应直接使用
    # 已校验的 .br，避免 CDN 按 MIME 改写语言包内容。
    location ^~ /packages/objects/ {
        # 对象必须作为二进制返回。否则 .html 资产会被 Cloudflare 当成页面，
        # 注入挑战脚本后改变响应体，运行器就会报「资源大小不匹配」。
        types {
            application/octet-stream html htm shtml js mjs json txt css wasm jar ;
        }
        default_type application/octet-stream ;
        # Brotli 响应按压缩字节寻址与清单的解压字节不一致，禁用 Range，
        # 让运行器检测到 200 后从头取完整解压流。
        max_ranges 0 ;
        try_files $uri.br =404 ;
        add_header Content-Encoding br always ;
        add_header Vary Accept-Encoding always ;
        add_header Access-Control-Allow-Origin "*" always ;
        add_header Cache-Control "public, max-age=31536000, immutable" always ;
    }

    location ^~ /packages/ {
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location = /engine/ {
        # blob: 是给语言服务用的（clangd/pyright 的 worker 与 wasm 从对象 URL 加载）。
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob:; frame-ancestors https://sgu-acw.zh314.xyz http://127.0.0.1:4324; base-uri 'none'; form-action 'none'" always ;
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        try_files /engine/index.html =404 ;
    }

    location = /engine/worker.js {
        # worker 内部不允许任何网络请求，语言包只能由 host 预先取好传进来。
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'none'; base-uri 'none'" always ;
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        try_files $uri =404 ;
    }

    location = /engine/sw.js {
        # host 从 /engine/sw.js 注册根作用域，必须显式放宽最大作用域。
        add_header Service-Worker-Allowed "/" always ;
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location ^~ /engine/ {
        # nginx 自带的 mime.types 里没有 .mjs，会退回 application/octet-stream，
        # 加上下面的 nosniff 浏览器就拒绝把它当模块执行（clangd 的运行时是 .mjs）。
        types {
            text/javascript mjs js ;
            application/wasm  wasm ;
            application/json  json ;
            application/octet-stream data index ;
        }
        add_header Cache-Control "no-store" always ;
        add_header X-Content-Type-Options "nosniff" always ;
        add_header Referrer-Policy "no-referrer" always ;
        try_files $uri =404 ;
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/" always ;
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location / {
        return 404 ;
    }
}
