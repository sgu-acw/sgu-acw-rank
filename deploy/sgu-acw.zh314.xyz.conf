# 静态前端站点（sgu-acw.zh314.xyz）源站配置
#
# 从 Cloudflare Pages 迁到「自有服务器 + Cloudflare CDN」后，Pages Function
# 承担的三件事必须由这里接管，否则登录、RSS、文章详情会全部坏掉：
#   1. /api/*          → 反代本机后端 8091（同源 Cookie 依赖它）
#   2. /blog/rss.xml   → 反代后端实时生成的 RSS
#   3. /post/*         → 回退到 /post/index.html（前端按 pathname 取 slug）
# 旧链接 301 与静态文件由 nginx 直接处理，不再经过任何函数。
#
# 由 deploy/migrate-to-server.sh 安装到
#   /opt/1panel/apps/openresty/openresty/conf/conf.d/sgu-acw.zh314.xyz.conf

server {
    listen 80 ;
    # 443 监听与证书放在 tls.d：没有证书时零匹配，站点仍可只靠 80 启动。
    include /www/sites/sgu-acw.zh314.xyz/secret/tls.d/*.conf ;
    server_name sgu-acw.zh314.xyz ;

    root /www/sites/sgu-acw.zh314.xyz/dist ;
    index index.html ;
    charset utf-8 ;

    access_log /www/sites/sgu-acw.zh314.xyz/log/access.log main ;
    error_log /www/sites/sgu-acw.zh314.xyz/log/error.log ;

    # 后端地址与来源密钥。密钥只存在于服务器本地文件，不进 git、不进前端。
    include /www/sites/sgu-acw.zh314.xyz/secret/*.conf ;

    client_max_body_size 8m ;

    gzip on ;
    gzip_vary on ;
    gzip_min_length 1024 ;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm ;

    # 带内容哈希的构建产物可以长期缓存；其余一律回源校验。
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always ;
        try_files $uri =404 ;
    }

    # Service Worker 必须每次校验，否则推送逻辑更新推不下去。
    location = /sw.js {
        add_header Cache-Control "no-cache" always ;
        try_files $uri =404 ;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8091 ;
        proxy_set_header Host $host ;
        proxy_set_header X-Real-IP $remote_addr ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
        proxy_set_header X-Forwarded-Proto $scheme ;
        proxy_set_header X-Forwarded-Host $host ;
        proxy_set_header X-Origin-Secret $sgu_acw_origin_secret ;
        proxy_http_version 1.1 ;
        proxy_connect_timeout 5s ;
        proxy_read_timeout 60s ;
        proxy_send_timeout 60s ;
        add_header Cache-Control "no-store" always ;
    }

    location = /blog/rss.xml {
        proxy_pass http://127.0.0.1:8091/api/posts/rss.xml ;
        proxy_set_header Host $host ;
        proxy_set_header X-Origin-Secret $sgu_acw_origin_secret ;
        proxy_http_version 1.1 ;
        proxy_connect_timeout 5s ;
        proxy_read_timeout 30s ;
        add_header Cache-Control "public, max-age=300" always ;
    }

    # 文章详情：地址栏保留 /post/{slug}，返回同一个静态壳。
    # 精确匹配壳本身，否则 try_files 回退到 /post/index.html 会再次命中
    # 这条前缀规则，形成内部重定向循环（实测 500）。
    location = /post/index.html {
        try_files $uri =404 ;
        add_header Cache-Control "no-cache" always ;
    }
    location ^~ /post/ {
        try_files $uri /post/index.html ;
        add_header Cache-Control "no-cache" always ;
    }

    # 旧链接（原 Pages _redirects 的内容）。
    location = /blog/10000-置顶 {
        return 301 /nav ;
    }
    location ^~ /blog/10000-置顶/ {
        return 301 /nav ;
    }
    location ^~ /blog/10000-%E7%BD%AE%E9%A1%B6 {
        return 301 /nav ;
    }
    location ^~ /member-awards/ {
        return 301 / ;
    }
    location = /blog/100-入门指南 {
        return 301 /post/100-入门指南 ;
    }
    location = /blog/100-%E5%85%A5%E9%97%A8%E6%8C%87%E5%8D%97 {
        return 301 /post/100-%E5%85%A5%E9%97%A8%E6%8C%87%E5%8D%97 ;
    }
    location = /blog/3-奖牌柜 {
        return 301 /post/3-奖牌柜 ;
    }
    location = /blog/3-%E5%A5%96%E7%89%8C%E6%9F%9C {
        return 301 /post/3-%E5%A5%96%E7%89%8C%E6%9F%9C ;
    }

    # 静态站其余路径：找不到就交给 404.html，不落到默认站点。
    location / {
        # 顺序很重要：先试 $uri.html 再试目录。反过来会让 /camps 命中
        # 目录并 301 到 /camps/，而站内链接都不带尾斜杠，等于每次都多一跳。
        try_files $uri $uri.html $uri/index.html =404 ;
        add_header Cache-Control "public, max-age=0, must-revalidate" always ;
    }

    # 404 必须是真 404 状态码，否则搜索引擎会把不存在的地址当成正常页面。
    error_page 404 /404.html ;
    location = /404.html {
        internal ;
    }

}

# 源站 TLS 由单独的 ssl.conf 提供：证书就位后由迁移脚本生成并 include。
# 没有证书时这个文件不存在，站点只在 80 上服务，Cloudflare 回源可先用
# Flexible，但登录 Cookie 会以明文跨公网——上线前必须换成 Full (strict)。

