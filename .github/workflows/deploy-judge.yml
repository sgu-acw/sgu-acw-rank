name: Deploy judge runner

# 评测运行器（judge.zh314.xyz）发布。
#
# 它和主站分开：运行器执行用户提交的代码，必须待在独立域名里，否则能读到
# 主站 Cookie。产物是约 750 MB 未压缩原件（语言包），由 Cloudflare 压缩，
# 所以发布走自己的 release 目录 + 软链，可回滚。
#
# 运行包（Python WASI、YoWASP Clang）由 fetch-runtimes.cjs 从公开来源直接
# 下载并按 sha256 校验，不依赖任何其他仓库的构建产物。只在 tools/learning/
# 或本工作流变化时触发。
on:
  push:
    branches: [main]
    paths:
      - 'tools/learning/**'
      - 'src/lib/learning/**'
      - 'src/components/learning/**'
      - 'deploy/deploy-judge.sh'
      - 'deploy/judge.zh314.xyz.conf'
      - '.github/workflows/deploy-judge.yml'
  workflow_dispatch:

concurrency:
  group: judge-deploy
  cancel-in-progress: false

env:
  REMOTE_ROOT: /opt/1panel/apps/openresty/openresty/www/sites/judge.zh314.xyz

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # brotli 统计 .br 传输量（压缩由 Cloudflare 做，源站存原件）；
      # zstd 解压服务器上预置的 Java 归档。
      - name: Install brotli and zstd
        run: sudo apt-get update && sudo apt-get install -y brotli zstd

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Java 运行时（B-JVM + JDK 21 类库 + ECJ）需要 Emscripten 编译和大量
      # 本地补丁，CI 里重建不现实。改为复用服务器上预置的归档：
      # 本地 pnpm learning:java 构建后 tar 上传到 /root/sgu-judge-artifacts/。
      # 没有归档时跳过，Java 会标记为不可用，其他语言照常发布。
      - name: Fetch prebuilt Java probe
        env:
          SGU_ACW_HOST: deploy-target
        run: |
          mkdir -p .local/learning/packages
          # 先打印服务器上的实际情况，方便排查；ssh 的退出码不要直接决定分支。
          ssh deploy-target 'ls -l /root/sgu-judge-artifacts/ 2>&1 || true'
          if ssh deploy-target 'test -f /root/sgu-judge-artifacts/java-probe.tar.zst'; then
            ssh deploy-target 'cat /root/sgu-judge-artifacts/java-probe.tar.zst' \
              | tar -C .local/learning/packages --use-compress-program=unzstd -xf -
            echo "Java 产物已从服务器拉取"
            ls -d .local/learning/packages/java-probe
          else
            echo "服务器上没有 Java 归档，本次不发布 Java 环境"
          fi

      - name: Prepare runner packages
        env:
          LEARN_PARENT_ORIGIN: https://sgu-acw.zh314.xyz
        run: pnpm learning:prepare

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SGU_ACW_SSH_KEY }}
          SSH_HOST: ${{ secrets.SGU_ACW_SSH_HOST }}
          SSH_USER: ${{ secrets.SGU_ACW_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          # 密钥可能带 CRLF 或缺少结尾换行，先规范化；ssh-keygen -y 提前暴露格式问题。
          printf '%s\n' "$SSH_KEY" | python3 -c "import sys; sys.stdout.write(sys.stdin.read().replace('\r\n', '\n').strip() + '\n')" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null
          # ssh-keyscan 在 runner 上会被拦，直接写死已知主机公钥。
          printf '%s\n' \
            '154.9.228.109 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOueouNQCFoKLYn0EkXUyp4uRdSzC4Lq2x23nfS9wD6w' \
            '154.9.228.109 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBHqfRQzBYzSuGi1VB9trjC+clDp5J5QRTd+4bf0Vkxd0rqj9x2ipgRodyp+Ty4Fp2kF6VkglrS3Uj7ht7f2Loa0=' \
            > ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes deploy-target true

      - name: Upload and switch release
        env:
          SGU_ACW_HOST: deploy-target
        run: ./deploy/deploy-judge.sh

      # 只校验源站。不要从 runner 去请求 Cloudflare：机房出口 IP 会被 WAF
      # 判成可疑流量返回 403，而源站和真实用户访问都是 200（deploy-judge.sh
      # 里已经用 Host 头打 127.0.0.1 验证过一轮）。
      - name: Verify origin through SSH
        env:
          SGU_ACW_HOST: deploy-target
        run: |
          ssh deploy-target 'for p in /engine/host.js /engine/worker.js /packages/manifest.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: judge.zh314.xyz" "http://127.0.0.1$p")
            echo "$p -> $code"
            test "$code" = 200 || exit 1
          done'
