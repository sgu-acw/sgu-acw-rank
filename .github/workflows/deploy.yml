name: Deploy frontend

# 前端静态站已从 Cloudflare Pages 迁到自有服务器（OpenResty 源站 +
# Cloudflare CDN）。Pages 单文件 25 MiB 上限放不下题库语言包，且运行器需要
# 独立域名与自有缓存策略，所以改由服务器直出。
#
# 推 main → lint/类型检查/构建 → 打包上传 → 原子切换 → 源站健康检查。
#
# 这里只发布主站。评测运行器（judge.zh314.xyz）由 deploy-judge.yml 发布：
# 它要重建 OJ++ 运行包（约 750 MB 未压缩原件），只在 tools/learning/ 等
# 相关路径变化时触发。
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  REMOTE_ROOT: /opt/1panel/apps/openresty/openresty/www/sites/sgu-acw.zh314.xyz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro build 只打包不检查；astro check 不检查模板里调用的函数是否存在。
      # 模板里用了不存在的函数只有 eslint 的 vue/no-undef-properties 能抓到。
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Judge regressions
        run: pnpm learning:test

      - name: Build
        env:
          # 题库在线上启用；运行器在独立域名。
          PUBLIC_LEARN_ENABLED: "true"
          PUBLIC_LEARN_RUNNER_ORIGIN: https://judge.zh314.xyz
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SGU_ACW_SSH_KEY }}
          SSH_HOST: ${{ secrets.SGU_ACW_SSH_HOST }}
          SSH_USER: ${{ secrets.SGU_ACW_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # secret 可能带 CRLF 或缺少结尾换行，两种 OpenSSH 都拒读。
          # 用 heredoc 写脚本：内联 python -c 会被 YAML 缩进带进源码。
          cat > /tmp/fixkey.py <<'PYEOF'
          import os
          data = os.environ["SSH_KEY"].replace(chr(13) + chr(10), chr(10)).strip() + chr(10)
          path = os.path.expanduser("~/.ssh/deploy_key")
          with open(path, "w", newline=chr(10)) as fh:
              fh.write(data)
          PYEOF
          python3 /tmp/fixkey.py
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo 'SSH 私钥无效' >&2; exit 1; }
          # 不依赖 runner 的 ssh-keyscan：GitHub 出口到 22 端口时常被拦，
          # 实测该步骤会拿不到公钥。host key 直接写死（ED25519 + ECDSA），
          # 指纹与服务器一致，比 TOFU 更严格。
          printf '%s\n' \
            '154.9.228.109 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOueouNQCFoKLYn0EkXUyp4uRdSzC4Lq2x23nfS9wD6w' \
            '154.9.228.109 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBHqfRQzBYzSuGi1VB9trjC+clDp5J5QRTd+4bf0Vkxd0rqj9x2ipgRodyp+Ty4Fp2kF6VkglrS3Uj7ht7f2Loa0=' \
            >> ~/.ssh/known_hosts
          # 后端 CI 用的是 user/host 两个独立 secret，这里保持一致。
          # 缩进的 heredoc 会把前导空格写进 config，Host 块就失效了。
          # 用 printf 生成，避免这类缩进陷阱。
          {
            printf 'Host deploy-target\n'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          # 立刻自检：配置和密钥都得能真的登进去，别等到 tar 管道中途才报错。
          ssh -o BatchMode=yes -o ConnectTimeout=15 deploy-target 'echo SSH_OK' || {
            echo 'SSH 连接失败' >&2
            exit 1
          }

      - name: Publish release
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          # 本地生成的发布路径需要在发送给 SSH 前展开。
          # shellcheck disable=SC2029
          ssh deploy-target "mkdir -p '$REMOTE_ROOT/releases/$RELEASE_ID'"
          # 单流 tar：长连接大流量下比 rsync 更稳。
          # shellcheck disable=SC2029
          tar -C dist -czf - . | ssh deploy-target "tar -xzf - -C '$REMOTE_ROOT/releases/$RELEASE_ID'"
          # 相对链接：OpenResty 在容器内运行，宿主机绝对路径不可见。
          # shellcheck disable=SC2029
          ssh deploy-target "set -e
            ln -sfn 'releases/$RELEASE_ID' '$REMOTE_ROOT/dist.next'
            mv -Tf '$REMOTE_ROOT/dist.next' '$REMOTE_ROOT/dist'
            ls -1dt '$REMOTE_ROOT'/releases/*/ | tail -n +4 | xargs -r rm -rf
          "

      - name: Health check
        run: |
          ssh deploy-target "set -e
            curl -fsS -o /dev/null -H 'Host: sgu-acw.zh314.xyz' http://127.0.0.1/
            curl -fsS -o /dev/null -H 'Host: sgu-acw.zh314.xyz' http://127.0.0.1/api/config
            curl -fsS -o /dev/null -H 'Host: sgu-acw.zh314.xyz' http://127.0.0.1/post/health-check
          "
